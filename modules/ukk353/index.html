  .modulex-acilis-video-pencere-h1 { font-family: var(--mx-font-heading, inherit); font-size: clamp(2.3rem, 5.2vw, 4.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; text-wrap: balance; }

  .modulex-acilis-video-pencere-sahne .modulex-acilis-video-pencere-dugme--ikincil { color: --ortuText--; border-color: color-mix(in srgb, --ortuText-- 60%, transparent); }
  .modulex-acilis-video-pencere-sahne .modulex-acilis-video-pencere-dugme--ikincil:hover { border-color: --ortuText--; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-acilis-video-pencere *, .modulex-acilis-video-pencere *::before, .modulex-acilis-video-pencere *::after { animation: none !important; transition: none !important; }

</style>
<script>
  (() => {
    const P = "modulex-acilis-video-pencere";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const video = (s, P, az) => {
      const v = s.querySelector("video");
      const b = s.querySelector("[data-video]");
      if (!v || !b) return;
      const ik = b.querySelector("span");
      const yaz = (oynuyor) => {
        b.setAttribute("aria-label", oynuyor ? b.dataset.durdur : b.dataset.oynat);
        b.setAttribute("aria-pressed", String(!oynuyor));
        if (ik) ik.textContent = oynuyor ? "pause" : "play_arrow";
      };
      if (az) { v.removeAttribute("autoplay"); v.pause(); yaz(false); }
      b.addEventListener("click", () => {
        if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => yaz(false)); yaz(true); } else { v.pause(); yaz(false); }
      });
    };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      video(s, P, az);
    });
  })();
</script>
