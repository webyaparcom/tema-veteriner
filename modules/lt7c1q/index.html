<style>
  /* sayac-vurgu-sutun — Rakamlar ana içerik değil, sayfa kenarında bir bilgi kolonu (sidebar); metin + CTA ile birlikte satış bloğu kurar. */
  .modulex-sayac-vurgu-sutun { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-vurgu-sutun *, .modulex-sayac-vurgu-sutun *::before, .modulex-sayac-vurgu-sutun *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-vurgu-sutun :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-vurgu-sutun :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-vurgu-sutun :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-vurgu-sutun :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-vurgu-sutun img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-vurgu-sutun) img { height: auto; }
  .modulex-sayac-vurgu-sutun [hidden] { display: none !important; }
  .modulex-sayac-vurgu-sutun :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-vurgu-sutun :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-vurgu-sutun-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-vurgu-sutun-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-vurgu-sutun--bassiz .modulex-sayac-vurgu-sutun-bas { display: none; }
  .modulex-sayac-vurgu-sutun-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-vurgu-sutun-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-vurgu-sutun-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-vurgu-sutun-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-vurgu-sutun-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-vurgu-sutun-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-vurgu-sutun-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-vurgu-sutun-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-vurgu-sutun-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-vurgu-sutun-duzen { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 88px); align-items: stretch; }
  .modulex-sayac-vurgu-sutun-icerik { display: grid; align-content: center; gap: 16px; }
  .modulex-sayac-vurgu-sutun-sutun { display: grid; align-content: center; padding: clamp(24px, 4vw, 44px); border-radius: --yuvarlak--; background: --vurguBg--; color: --vurguText--; }
  .modulex-sayac-vurgu-sutun-oge { display: grid; gap: 4px; padding-block: 20px; border-block-end: 1px solid color-mix(in srgb, --vurguText-- 25%, transparent); transition: padding 0.3s ease; }
  .modulex-sayac-vurgu-sutun-oge:last-child { border-block-end: 0; }
  .modulex-sayac-vurgu-sutun-oge:hover { padding-inline-start: 10px; }
  .modulex-sayac-vurgu-sutun-sayi { font-size: clamp(2.2rem, 4vw, 3rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
  .modulex-sayac-vurgu-sutun-ek { font-size: 0.55em; }
  .modulex-sayac-vurgu-sutun-etiket { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 600; }
  .modulex-sayac-vurgu-sutun-ikon { font-size: 20px; opacity: 0.9; }
  @media (max-width: 768px) {
    .modulex-sayac-vurgu-sutun-duzen { grid-template-columns: minmax(0, 1fr); }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-vurgu-sutun :is(.modulex-sayac-vurgu-sutun-baslik, .modulex-sayac-vurgu-sutun-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-vurgu-sutun-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-vurgu-sutun { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-vurgu-sutun *, .modulex-sayac-vurgu-sutun *::before, .modulex-sayac-vurgu-sutun *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-vurgu-sutun";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sayac(s, P, az);
    });
  })();
</script>
